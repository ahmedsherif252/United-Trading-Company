<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>المتحدة للتجارة | نظام إدارة المعارض</title>
<style>
:root{--bg:#08111f;--panel:#101c2d;--panel2:#14243a;--line:#263951;--text:#f2f5fb;--muted:#91a4bd;--gold:#e4bd68;--blue:#55b7ff;--green:#41d5a0;--red:#ff7777;--purple:#b49aff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.6}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:#172a43;color:var(--text);padding:10px 14px}button:hover{filter:brightness(1.12)}button.primary{background:var(--gold);color:#17202b;border-color:var(--gold);font-weight:bold}button.ghost{background:transparent}.wrap{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#0b1626;border-left:1px solid var(--line);padding:22px 15px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;border-bottom:1px solid var(--line)}.logo{width:44px;height:44px;border-radius:13px;background:#24344a;color:var(--gold);display:grid;place-items:center;font-size:24px}.brand b{display:block;font-size:16px}.brand small{color:var(--muted);font-size:11px}.navtitle{font-size:11px;color:var(--muted);padding:18px 10px 7px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{text-align:right;background:transparent;border-color:transparent;padding:11px 12px;color:#b7c5d7}.nav button.active,.nav button:hover{background:#182b43;border-color:#2e4562;color:white}.nav .ico{display:inline-block;width:26px;color:var(--gold)}.sidefoot{font-size:11px;color:var(--muted);margin-top:22px;padding:12px;border:1px solid var(--line);border-radius:12px}.main{min-width:0;padding:24px clamp(14px,3vw,34px) 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:24px}.crumb{color:var(--muted);font-size:12px}.top h1{font-size:25px;margin:3px 0}.tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 12px;color:#cbd7e6;font-size:12px}.branch-select{background:var(--panel);color:white;border:1px solid var(--line);padding:10px;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;min-width:0}.stat-label{color:var(--muted);font-size:12px}.stat{font-size:25px;font-weight:bold;margin:8px 0 2px}.stat-sub{font-size:11px;color:var(--muted)}.gold{color:var(--gold)}.green{color:var(--green)}.blue{color:var(--blue)}.red{color:var(--red)}.purple{color:var(--purple)}.layout2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-bottom:17px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.panel-head h2{font-size:16px;margin:0}.muted{color:var(--muted)}.bars{display:flex;align-items:end;gap:10px;height:150px;padding:10px 5px 0;border-bottom:1px solid var(--line)}.barcol{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px;height:100%;font-size:10px;color:var(--muted)}.bar{width:min(34px,70%);background:linear-gradient(180deg,#62bdff,#27669b);border-radius:7px 7px 2px 2px;min-height:8px}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:13px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:5px}.branch-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.branch-card{background:#0d1929;border:1px solid var(--line);border-radius:12px;padding:13px}.branch-card b{display:block}.branch-card small{color:var(--muted)}.branch-card .branch-meta{font-size:11px;margin-top:10px;display:flex;justify-content:space-between;gap:8px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:680px;font-size:12px}th,td{text-align:right;padding:12px 13px;border-bottom:1px solid #223249;white-space:nowrap}th{background:#14243a;color:#aebed1;font-weight:normal}tr:last-child td{border-bottom:0}.status{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;background:#183c32;color:var(--green)}.status.pending{background:#42351d;color:#f2cb72}.status.rejected{background:#42252b;color:#ff9292}.actions{display:flex;gap:7px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:#b6c5d8}.field input,.field select,.field textarea,.search{width:100%;background:#091625;color:white;border:1px solid #30445e;border-radius:9px;padding:11px;outline:none}.field input:focus,.field select:focus,.search:focus{border-color:var(--gold)}.full{grid-column:1/-1}.empty{text-align:center;color:var(--muted);padding:25px}.notice{padding:12px 14px;border:1px solid #2c624f;background:#102b26;color:#8fe7c3;border-radius:10px;margin-bottom:15px}.sectiongap{margin-top:17px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar .search{max-width:330px}.hidden{display:none!important}.branch-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.branch-summary .mini{background:#0b1828;border:1px solid var(--line);border-radius:12px;padding:13px}.mini small{color:var(--muted)}.mini strong{display:block;font-size:18px;margin-top:6px}.footer{color:#7187a2;font-size:11px;margin-top:24px;text-align:center}.modalback{position:fixed;inset:0;background:#020711cc;display:grid;place-items:center;padding:16px;z-index:20}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid #3b506a;border-radius:18px;padding:22px;box-shadow:0 20px 70px #0009}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{margin:0;font-size:19px}.toast{position:fixed;bottom:20px;left:20px;background:#17362e;border:1px solid #34725b;color:#b0f2d9;padding:12px 18px;border-radius:12px;z-index:40;max-width:90vw}.danger{color:var(--red)}.small{font-size:11px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#1b3048 0,#08111f 58%)}.loginbox{width:min(430px,100%);background:#101c2d;border:1px solid var(--line);border-radius:22px;padding:28px}.loginbox .brand{justify-content:center;border:0}.loginbox h1{text-align:center;font-size:23px}.loginbox p{text-align:center;color:var(--muted);font-size:13px}.loginbox .field{margin:14px 0}.loginbox button{width:100%;margin-top:12px}.demo-warning{background:#3c301a;color:#f5d58c;border:1px solid #6a552a;border-radius:10px;padding:10px;font-size:11px;margin-top:15px}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.layout2{grid-template-columns:1fr}.branch-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.wrap{grid-template-columns:1fr}.side{position:relative;height:auto;padding:12px;border-left:0;border-bottom:1px solid var(--line)}.brand{padding-bottom:12px}.navtitle{padding-top:10px}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.nav button{padding:9px;font-size:12px}.sidefoot{display:none}.main{padding:18px 12px 30px}.top h1{font-size:21px}.cards{gap:9px}.card{padding:12px}.stat{font-size:21px}.branch-list{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.branch-summary{grid-template-columns:1fr}.tools{width:100%}}
@media(max-width:390px){.branch-list{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.pill{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalroot"></div>
<div id="toastroot"></div>
<script>
const BRANCHES=["الشمس","الجوهرة","اللؤلؤة","الميدان","الواحة","هاي تك"];
const TYPES=["مبيعات","تحصيل","مقدمات","أقساط","غرامات","واردات","مصروفات"];
const NAV=[["dashboard","الرئيسية","▦"],["transactions","العمليات المالية","↔"],["sales","المبيعات","▣"],["collections","التحصيلات","⇩"],["installments","العملاء والأقساط","◷"],["expenses","المصروفات","−"],["incomes","الواردات","+"],["penalties","الغرامات","!"],["reports","التقارير","▥"],["branches","إدارة المعارض","⌂"],["users","المستخدمون والصلاحيات","♙"],["audit","سجل المراجعة","◴"],["settings","الإعدادات","⚙"]];
const fmt=n=>Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const monthNow=()=>today().slice(0,7);
let state={role:"admin",branch:BRANCHES[0],page:"dashboard",search:"",month:monthNow(),type:"الكل",records:[],users:[],logged:false};
function load(){try{const x=JSON.parse(localStorage.getItem("utc_demo_db")||"{}");state.records=x.records||[];state.users=x.users||[]}catch(e){}}
function save(){localStorage.setItem("utc_demo_db",JSON.stringify({records:state.records,users:state.users}));}
function money(n){return fmt(n)+" ج.م"}
function visibleRecords(){return state.records.filter(r=>(state.role==="admin"||r.branch===state.branch)&&(!state.month||r.date.startsWith(state.month))&&(state.type==="الكل"||r.type===state.type)&&(`${r.name} ${r.note} ${r.type} ${r.branch}`).toLowerCase().includes(state.search.toLowerCase()))}
function sumType(type){return visibleRecords().filter(r=>r.type===type&&r.status==="معتمدة").reduce((a,r)=>a+Number(r.amount),0)}
function toast(s){document.getElementById("toastroot").innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>document.getElementById("toastroot").innerHTML="",3200)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function titlePage(){return (NAV.find(n=>n[0]===state.page)||NAV[0])[1]}
function admin(){return state.role==="admin"}
function header(){return `<header class="top"><div><div class="crumb">المتحدة للتجارة / ${esc(titlePage())}</div><h1>${esc(titlePage())}</h1><div class="muted small">${admin()?"الإدارة المركزية · جميع المعارض":"مدير معرض · "+esc(state.branch)}</div></div><div class="tools">${admin()?`<span class="pill">● صلاحيات الإدارة المركزية</span>`:`<span class="pill">● ${esc(state.branch)}</span>`}<select class="branch-select" id="month"><option value="">كل الفترات</option>${Array.from({length:12},(_,i)=>{let d=new Date();d.setMonth(d.getMonth()-i);let v=d.toISOString().slice(0,7);return `<option value="${v}" ${state.month===v?"selected":""}>${v}</option>`}).join("")}</select><button class="ghost" id="logout">خروج ↗</button></div></header>`}
function stat(label,value,cls,sub="إجمالي العمليات المعتمدة"){return `<div class="card"><div class="stat-label">${label}</div><div class="stat ${cls}">${money(value)}</div><div class="stat-sub">${sub}</div></div>`}
function recordsTable(records){if(!records.length)return `<div class="empty">لا توجد عمليات بعد. ابدأ بإضافة أول عملية من زر «إضافة عملية».</div>`;return `<div class="tablewrap"><table><thead><tr><th>التاريخ</th>${admin()?"<th>المعرض</th>":""}<th>النوع</th><th>البيان</th><th>العميل / المسؤول</th><th>المبلغ</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>${records.map(r=>`<tr><td>${esc(r.date)}</td>${admin()?`<td>${esc(r.branch)}</td>`:""}<td>${esc(r.type)}</td><td>${esc(r.note)}</td><td>${esc(r.name||"—")}</td><td>${money(r.amount)}</td><td><span class="status ${r.status==="بانتظار الاعتماد"?"pending":r.status==="مرفوضة"?"rejected":""}">${esc(r.status)}</span></td><td><div class="actions">${r.status==="بانتظار الاعتماد"?`<button data-act="approve" data-id="${r.id}" class="primary">اعتماد</button><button data-act="reject" data-id="${r.id}">رفض</button>`:`<button data-act="details" data-id="${r.id}">تفاصيل</button>`}</div></td></tr>`).join("")}</tbody></table></div>`}
function dashboard(){const rs=visibleRecords(),approved=rs.filter(r=>r.status==="معتمدة");let total=t=>approved.filter(r=>r.type===t).reduce((s,r)=>s+Number(r.amount),0);let sales=total("مبيعات"),coll=total("تحصيل")+total("مقدمات")+total("أقساط")+total("غرامات"),inc=total("واردات"),exp=total("مصروفات"),pending=rs.filter(r=>r.status==="بانتظار الاعتماد").length;return `${header()}<div class="cards">${stat("إجمالي المبيعات",sales,"blue")}${stat("التحصيلات والمبالغ المستلمة",coll,"green")}${stat("إجمالي الواردات",inc,"gold")}${stat("إجمالي المصروفات",exp,"red")}</div><div class="layout2"><section class="panel"><div class="panel-head"><h2>ملخص العمليات</h2><span class="pill">${esc(state.month||"كل الفترات")}</span></div><div class="branch-summary"><div class="mini"><small>عمليات معتمدة</small><strong>${approved.length}</strong></div><div class="mini"><small>بانتظار الاعتماد</small><strong class="gold">${pending}</strong></div><div class="mini"><small>صافي حركة مبسطة</small><strong class="${inc+coll-exp>=0?"green":"red"}">${money(inc+coll-exp)}</strong></div></div><div class="legend"><span><i class="dot" style="background:var(--blue)"></i>المبيعات</span><span><i class="dot" style="background:var(--green)"></i>التحصيلات</span><span><i class="dot" style="background:var(--red)"></i>المصروفات</span></div><div class="bars">${[["مبيعات",sales],["تحصيل",total("تحصيل")],["واردات",inc],["مصروفات",exp]].map(([n,v])=>`<div class="barcol"><div class="bar" style="height:${Math.max(8,Math.min(100,v/Math.max(1,sales,coll,inc,exp)*100))}%"></div><span>${n}</span></div>`).join("")}</div><p class="muted small">المؤشرات مبنية على العمليات التي تسجلها في النظام. رصيد الخزينة النهائي يحتاج تحديد قواعد الرصيد الافتتاحي والتسويات.</p></section><section class="panel"><div class="panel-head"><h2>${admin()?"المعارض":"ملخص الفرع"}</h2>${admin()?`<button data-page="branches">إدارة المعارض</button>`:""}</div>${admin()?`<div class="branch-list">${BRANCHES.map((b,i)=>{let br=state.records.filter(r=>r.branch===b&&r.status==="معتمدة"&&(!state.month||r.date.startsWith(state.month)));let s=br.filter(r=>r.type==="مبيعات").reduce((a,r)=>a+ +r.amount,0),c=br.filter(r=>["تحصيل","مقدمات","أقساط"].includes(r.type)).reduce((a,r)=>a+ +r.amount,0);return `<div class="branch-card"><b>${esc(b)}</b><small>فرع ${String(i+1).padStart(2,"0")}</small><div class="branch-meta"><span>مبيعات</span><strong>${fmt(s)}</strong></div><div class="branch-meta"><span>تحصيل</span><strong class="green">${fmt(c)}</strong></div><button style="width:100%;margin-top:10px;padding:7px" data-branch="${esc(b)}">فتح الفرع</button></div>`}).join("")}</div>`:`<div class="branch-card"><b>${esc(state.branch)}</b><small>ملخص الفترة المحددة</small><div class="branch-meta"><span>عدد العمليات</span><strong>${rs.length}</strong></div><div class="branch-meta"><span>قيد الاعتماد</span><strong class="gold">${pending}</strong></div><button style="width:100%;margin-top:12px" data-page="transactions">عرض العمليات</button></div>`}</section></div><section class="panel"><div class="panel-head"><h2>آخر العمليات</h2><button data-page="transactions">عرض الكل</button></div>${recordsTable(rs.slice().sort((a,b)=>b.created.localeCompare(a.created)).slice(0,6))}</section>`}
function transactions(){let rs=visibleRecords().slice().sort((a,b)=>b.created.localeCompare(a.created));return `${header()}<section class="panel"><div class="toolbar"><button class="primary" id="addRecord">＋ إضافة عملية</button><input class="search" id="search" placeholder="ابحث في العمليات..." value="${esc(state.search)}"><select class="branch-select" id="type"><option>الكل</option>${TYPES.map(t=>`<option ${state.type===t?"selected":""}>${t}</option>`).join("")}</select><button id="exportCsv">تصدير CSV</button></div>${recordsTable(rs)}</section>`}
function reports(){let rs=visibleRecords(),approved=rs.filter(r=>r.status==="معتمدة");return `${header()}<section class="panel"><div class="panel-head"><h2>ملخص التقرير المالي</h2><button id="exportCsv">تصدير CSV</button></div><div class="cards">${stat("المبيعات",sum("مبيعات",approved),"blue")}${stat("التحصيل",sum("تحصيل",approved)+sum("مقدمات",approved)+sum("أقساط",approved),"green")}${stat("الواردات",sum("واردات",approved),"gold")}${stat("المصروفات",sum("مصروفات",approved),"red")}</div><p class="muted small">يتم احتساب الأرقام من العمليات المعتمدة فقط. يجب مطابقة معادلات الرصيد اليومي مع ملف تقارير الشمس قبل الاستخدام المالي الفعلي.</p>${recordsTable(rs)}</section>`}
function sum(t,rs){return rs.filter(r=>r.type===t).reduce((a,r)=>a+Number(r.amount),0)}
function branches(){return `${header()}<section class="panel"><div class="panel-head"><h2>المعارض المسجلة</h2><span class="pill">6 معارض</span></div><div class="branch-list">${BRANCHES.map((b,i)=>`<div class="branch-card"><b>${esc(b)}</b><small>كود الفرع: UTC-${String(i+1).padStart(2,"0")}</small><div class="branch-meta"><span>عمليات الفترة</span><strong>${state.records.filter(r=>r.branch===b&&(!state.month||r.date.startsWith(state.month))).length}</strong></div><button style="width:100%;margin-top:12px" data-branch="${esc(b)}">فتح لوحة الفرع</button></div>`).join("")}</div></section>`}
function users(){if(!admin())return `${header()}<section class="panel"><h2>غير مصرح</h2><p class="muted">إدارة الحسابات متاحة للإدارة المركزية فقط.</p></section>`;return `${header()}<section class="panel"><div class="panel-head"><h2>مديرو الفروع وحسابات الدخول</h2><button class="primary" id="addUser">＋ إضافة حساب مدير</button></div><p class="muted small">أسماء المديرين يمكن إدخالها لاحقًا. هذا النموذج لا ينشئ حسابات دخول آمنة على خادم.</p>${state.users.length?`<div class="tablewrap"><table><thead><tr><th>اسم المدير</th><th>اسم المستخدم</th><th>الفرع</th><th>الدور</th></tr></thead><tbody>${state.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${esc(u.branch)}</td><td>مدير فرع</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">لم تُضف حسابات بعد. يمكنك إدخال بيانات المديرين لاحقًا.</div>`}</section>`}
function audit(){return `${header()}<section class="panel"><h2>سجل المراجعة</h2><p class="muted">سجل تجريبي محلي للعمليات الحالية. عند ربط النظام بخادم، يجب أن يكون سجل التدقيق مركزيًا وغير قابل للتعديل من مديري الفروع.</p>${recordsTable(visibleRecords().slice().sort((a,b)=>b.created.localeCompare(a.created)))}</section>`}
function settings(){return `${header()}<section class="panel"><h2>إعدادات النظام</h2><p class="muted">إعدادات مقترحة قبل التشغيل الحقيقي.</p><ul><li>تحديد الرصيد الافتتاحي لكل فرع.</li><li>تحديد معادلات الرصيد اليومي ومصادر الوارد والمنصرف.</li><li>تحديد متى تؤثر المبيعات والمقدمات والأقساط في الرصيد.</li><li>تحديد آلية تصحيح العمليات بعد اعتمادها.</li><li>تفعيل نسخ احتياطي وصلاحيات خادمية.</li></ul><button id="downloadBackup">تنزيل نسخة احتياطية للبيانات التجريبية</button><button id="clearDemo" class="ghost">مسح البيانات المحلية</button></section>`}
function pageContent(){switch(state.page){case"dashboard":return dashboard();case"transactions":return transactions();case"sales":state.type="مبيعات";return transactions();case"collections":state.type="تحصيل";return transactions();case"installments":state.type="أقساط";return transactions();case"expenses":state.type="مصروفات";return transactions();case"incomes":state.type="واردات";return transactions();case"penalties":state.type="غرامات";return transactions();case"reports":return reports();case"branches":return branches();case"users":return users();case"audit":return audit();case"settings":return settings();default:return dashboard()}}
function render(){if(!state.logged){renderLogin();return}const menu=NAV.filter(n=>admin()||!["branches","users","settings"].includes(n[0]));document.getElementById("app").innerHTML=`<div class="wrap"><aside class="side"><div class="brand"><div class="logo">م</div><div><b>المتحدة للتجارة</b><small>UNITED TRADING COMPANY</small></div></div><div class="navtitle">القائمة الرئيسية</div><nav class="nav">${menu.map(n=>`<button class="${state.page===n[0]?"active":""}" data-page="${n[0]}"><span class="ico">${n[2]}</span>${n[1]}</button>`).join("")}</nav><div class="sidefoot">● النظام الداخلي<br><br>نسخة تصميم أولية<br>لا تستخدم للأرصدة الفعلية قبل ربط قاعدة البيانات.</div></aside><main class="main">${pageContent()}<div class="footer">المتحدة للتجارة · نموذج واجهة أولي · البيانات محفوظة محليًا على هذا المتصفح فقط</div></main></div>`;bind()}
function renderLogin(){document.getElementById("app").innerHTML=`<main class="login"><div class="loginbox"><div class="brand"><div class="logo">م</div><div><b>المتحدة للتجارة</b><small>UNITED TRADING COMPANY</small></div></div><h1>تسجيل الدخول</h1><p>نظام إدارة المعارض والتقارير المالية</p><div class="field"><label>نوع الحساب للمعاينة</label><select id="loginrole"><option value="admin">الإدارة المركزية — كل المعارض</option><option value="manager">مدير فرع</option></select></div><div class="field" id="branchfield" style="display:none"><label>الفرع</label><select id="loginbranch">${BRANCHES.map(b=>`<option>${b}</option>`).join("")}</select></div><div class="field"><label>اسم المستخدم</label><input id="username" placeholder="اسم المستخدم (للعرض فقط)" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" placeholder="كلمة المرور (غير متصلة بخادم)" autocomplete="current-password"></div><button class="primary" id="loginbtn">دخول إلى النظام</button><div class="demo-warning">وضع المعاينة: تسجيل الدخول هنا لا يتحقق من كلمة مرور حقيقية. لا تدخل كلمات مرور فعلية أو بيانات سرية.</div></div></main>`;document.getElementById("loginrole").onchange=e=>document.getElementById("branchfield").style.display=e.target.value==="manager"?"block":"none";document.getElementById("loginbtn").onclick=()=>{state.role=document.getElementById("loginrole").value==="admin"?"admin":"manager";state.branch=document.getElementById("loginbranch").value;state.logged=true;state.page="dashboard";render()}}
function bind(){document.querySelectorAll("[data-page]").forEach(el=>el.onclick=()=>{state.page=el.dataset.page;state.search="";if(!["sales","collections","installments","expenses","incomes","penalties"].includes(state.page))state.type="الكل";render()});document.querySelectorAll("[data-branch]").forEach(el=>el.onclick=()=>{state.branch=el.dataset.branch;if(!admin())state.role="manager";state.page="dashboard";render()});document.getElementById("logout")?.addEventListener("click",()=>{state.logged=false;render()});document.getElementById("month")?.addEventListener("change",e=>{state.month=e.target.value;render()});document.getElementById("addRecord")?.addEventListener("click",recordModal);document.getElementById("addUser")?.addEventListener("click",userModal);document.getElementById("search")?.addEventListener("input",e=>{state.search=e.target.value;let pos=e.target.selectionStart;render();let el=document.getElementById("search");el?.focus();el?.setSelectionRange(pos,pos)});document.getElementById("type")?.addEventListener("change",e=>{state.type=e.target.value;render()});document.getElementById("exportCsv")?.addEventListener("click",exportCsv);document.getElementById("downloadBackup")?.addEventListener("click",backup);document.getElementById("clearDemo")?.addEventListener("click",()=>{if(confirm("مسح جميع البيانات التجريبية من هذا المتصفح؟")){state.records=[];state.users=[];save();render();toast("تم مسح البيانات المحلية")}});document.querySelectorAll("[data-act]").forEach(el=>el.onclick=()=>act(el.dataset.act,el.dataset.id))}
function recordModal(){const branches=admin()?`<div class="field"><label>المعرض</label><select name="branch">${BRANCHES.map(b=>`<option ${b===state.branch?"selected":""}>${b}</option>`).join("")}</select></div>`:`<input type="hidden" name="branch" value="${esc(state.branch)}">`;document.getElementById("modalroot").innerHTML=`<div class="modalback" id="backdrop"><div class="modal"><div class="modalhead"><h2>إضافة عملية مالية</h2><button id="closemodal">✕</button></div><form id="recordform"><div class="formgrid">${branches}<div class="field"><label>نوع العملية</label><select name="type" required>${TYPES.map(t=>`<option ${state.type===t?"selected":""}>${t}</option>`).join("")}</select></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>المبلغ بالجنيه</label><input name="amount" type="number" min="0.01" step="0.01" required placeholder="0.00"></div><div class="field"><label>اسم العميل / المسؤول</label><input name="name" placeholder="اختياري"></div><div class="field full"><label>البيان</label><input name="note" required placeholder="اكتب وصف العملية"></div><div class="field full"><label>ملاحظات</label><textarea name="memo" rows="2" placeholder="ملاحظات إضافية (اختياري)"></textarea></div></div><p class="muted small">في وضع التشغيل الفعلي، اعتماد المدير سيُسجل من خلال خادم آمن. هنا يتم تسجيل العملية بحالة «بانتظار الاعتماد».</p><div class="actions"><button class="primary" type="submit">حفظ العملية</button><button type="button" id="cancelmodal">إلغاء</button></div></form></div></div>`;document.getElementById("closemodal").onclick=closeModal;document.getElementById("cancelmodal").onclick=closeModal;document.getElementById("backdrop").onclick=e=>{if(e.target.id==="backdrop")closeModal()};document.getElementById("recordform").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),r={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),branch:f.get("branch"),type:f.get("type"),date:f.get("date"),amount:Number(f.get("amount")),name:f.get("name"),note:f.get("note"),memo:f.get("memo"),status:"بانتظار الاعتماد",created:new Date().toISOString(),createdBy:state.role==="admin"?"الإدارة المركزية":"مدير "+state.branch};state.records.push(r);save();closeModal();state.page="transactions";state.type="الكل";render();toast("تم حفظ العملية بانتظار الاعتماد")}}
function closeModal(){document.getElementById("modalroot").innerHTML=""}
function act(action,id){let r=state.records.find(x=>x.id===id);if(!r)return;if(action==="details"){alert(`الفرع: ${r.branch}\\nالنوع: ${r.type}\\nالبيان: ${r.note}\\nالمبلغ: ${money(r.amount)}\\nالحالة: ${r.status}\\nالمسجل: ${r.createdBy}`);return}if(action==="approve"){if(!confirm("اعتماد العملية؟ سيتم تحديث حالتها في النموذج التجريبي."))return;r.status="معتمدة";r.approvedBy=state.role==="admin"?"الإدارة المركزية":"مدير "+state.branch;r.approvedAt=new Date().toISOString();save();render();toast("تم اعتماد العملية في البيانات المحلية")}if(action==="reject"){let reason=prompt("اكتب سبب الرفض:");if(reason===null)return;r.status="مرفوضة";r.rejectReason=reason;r.approvedBy=state.role==="admin"?"الإدارة المركزية":"مدير "+state.branch;save();render();toast("تم رفض العملية في البيانات المحلية")}}
function userModal(){document.getElementById("modalroot").innerHTML=`<div class="modalback"><div class="modal"><div class="modalhead"><h2>إضافة مدير فرع (للقائمة التجريبية)</h2><button id="closemodal">✕</button></div><form id="userform"><div class="formgrid"><div class="field"><label>اسم المدير</label><input name="name" required></div><div class="field"><label>اسم المستخدم</label><input name="username" required></div><div class="field full"><label>الفرع</label><select name="branch">${BRANCHES.map(b=>`<option>${b}</option>`).join("")}</select></div></div><div class="demo-warning">لا تُدخل كلمة مرور هنا؛ إنشاء حسابات حقيقية يتطلب خادم مصادقة آمنًا.</div><button class="primary" type="submit">إضافة إلى القائمة</button></form></div></div>`;document.getElementById("closemodal").onclick=closeModal;document.getElementById("userform").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.users.push({name:f.get("name"),username:f.get("username"),branch:f.get("branch")});save();closeModal();render();toast("أضيف المدير للقائمة التجريبية")}}
function exportCsv(){let rs=visibleRecords();let rows=[["التاريخ","المعرض","النوع","البيان","العميل","المبلغ","الحالة"],...rs.map(r=>[r.date,r.branch,r.type,r.note,r.name,r.amount,r.status])];let csv="\\ufeff"+rows.map(row=>row.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\\r\\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));a.download="united-trading-report.csv";a.click();URL.revokeObjectURL(a.href)}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({records:state.records,users:state.users},null,2)],{type:"application/json"}));a.download="united-trading-demo-backup.json";a.click();URL.revokeObjectURL(a.href)}
load();render();
</script>
</body></html>
