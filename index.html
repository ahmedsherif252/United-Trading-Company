<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المتحدة للتجارة | نظام المعارض</title>
<style>
:root{color-scheme:dark;--bg:#08111f;--panel:#101c2d;--line:#263951;--text:#f2f5fb;--muted:#91a4bd;--gold:#e4bd68;--green:#41d5a0;--red:#ff7777;--blue:#55b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.65}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:#172a43;color:var(--text);padding:10px 14px}button.primary{background:var(--gold);color:#17202b;font-weight:bold}button:disabled{opacity:.5;cursor:not-allowed}.wrap{max-width:1200px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:13px;background:#24344a;color:var(--gold);display:grid;place-items:center;font-size:24px}.muted{color:var(--muted);font-size:13px}.panel,.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:#b6c5d8}.field input,.field select,.field textarea{background:#091625;color:white;border:1px solid #30445e;border-radius:9px;padding:11px;width:100%}.full{grid-column:1/-1}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#1b3048 0,#08111f 58%)}.loginbox{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px}.loginbox h1{text-align:center}.loginbox .field{margin:13px 0}.loginbox button{width:100%;margin-top:10px}.notice{padding:12px;border-radius:10px;background:#102b26;border:1px solid #2c624f;color:#8fe7c3;margin-bottom:14px}.error{background:#351d25;border-color:#70404b;color:#ffb7bf}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:700px;font-size:12px}th,td{text-align:right;padding:12px;border-bottom:1px solid #223249}th{background:#14243a;color:#aebed1;font-weight:normal}.badge{padding:3px 8px;border-radius:20px;background:#42351d;color:#f2cb72}.badge.ok{background:#183c32;color:var(--green)}.badge.no{background:#42252b;color:#ff9292}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap}.footer{text-align:center;color:#7187a2;font-size:11px;margin-top:20px}@media(max-width:760px){.wrap{padding:12px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://scxpeuihfyiijosrwvmi.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjeHBldWloZnlpaWpvc3J3dm1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2ODAwMTcsImV4cCI6MjEwODI1NjAxN30.m2gBeZEBmHSUA95TjrA06YqPWrX1UIAWBwh-O8gDrjQ';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const TYPES={sale:'مبيعات',collection:'تحصيل',installment:'قسط',down_payment:'مقدم',penalty:'غرامة',income:'واردات',expense:'مصروفات'};
const BRANCHES=['الشمس','الجوهرة','اللؤلؤة','الميدان','الواحة','هاي تك'];let user=null,profile=null,branches=[],records=[],msg='';const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م';
function showMessage(text,isError=false){msg=text;const n=el('message');if(n){n.textContent=text;n.className='notice'+(isError?' error':'');n.classList.remove('hidden')}}
function loginScreen(){el('app').innerHTML=`<main class="login"><section class="loginbox"><div class="brand"><div class="logo">م</div><div><b>المتحدة للتجارة</b><div class="muted">UNITED TRADING COMPANY</div></div></div><h1>تسجيل الدخول</h1><p class="muted">سجّل الدخول بحساب أنشأته في Supabase.</p><div id="message" class="notice ${msg?'':'hidden'}">${esc(msg)}</div><form id="loginForm"><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" id="loginBtn">تسجيل الدخول</button></form><p class="muted">لا تستخدم بيانات تجريبية. إذا لم يعمل الدخول، تحقق من إعدادات Authentication في Supabase.</p></section></main>`;el('loginForm').onsubmit=async e=>{e.preventDefault();const btn=el('loginBtn');btn.disabled=true;btn.textContent='جارٍ تسجيل الدخول…';const {error}=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});btn.disabled=false;btn.textContent='تسجيل الدخول';if(error){showMessage('تعذّر تسجيل الدخول: '+error.message,true);return}await init()}}
function appShell(){const isAdmin=profile.role==='admin';el('app').innerHTML=`<div class="wrap"><header class="top"><div class="brand"><div class="logo">م</div><div><b>المتحدة للتجارة</b><div class="muted">نظام إدارة المعارض · ${isAdmin?'الإدارة المركزية':esc(branches.find(b=>b.id===profile.branch_id)?.name||'مدير فرع')}</div></div></div><div class="actions"><span class="muted">${esc(user.email)}</span><button id="logout">تسجيل الخروج</button></div></header><div id="message" class="notice ${msg?'':'hidden'}">${esc(msg)}</div><section class="stats"><div class="stat"><small>المبيعات المعتمدة</small><strong id="sales">—</strong></div><div class="stat"><small>التحصيلات والأقساط</small><strong id="collections">—</strong></div><div class="stat"><small>المصروفات المعتمدة</small><strong id="expenses">—</strong></div><div class="stat"><small>عمليات بانتظار الاعتماد</small><strong id="pending">—</strong></div></section><div class="grid"><section class="panel"><h2>إضافة عملية مالية</h2><form id="recordForm" class="fields">${isAdmin?`<div class="field full"><label>المعرض</label><select id="branch" required>${branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div>`:''}<div class="field"><label>نوع العملية</label><select id="type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>المبلغ بالجنيه</label><input id="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>البيان</label><input id="description" required maxlength="300"></div><button class="primary full" id="saveBtn">حفظ العملية بانتظار الاعتماد</button></form></section><section class="panel"><h2>المعارض</h2><p class="muted">${isAdmin?'تظهر لك المعارض الستة.':'صلاحيتك مرتبطة بفرعك المسجل في قاعدة البيانات.'}</p><div>${branches.map(b=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)">${esc(b.name)}</div>`).join('')}</div></section></div><section class="panel"><div class="top"><h2>سجل العمليات المالية</h2><button id="refresh">تحديث البيانات</button></div><div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>المعرض</th><th>النوع</th><th>البيان</th><th>المبلغ</th><th>الحالة</th>${isAdmin?'<th>إجراء</th>':''}</tr></thead><tbody id="recordsBody"></tbody></table></div></section><div class="footer">نسخة ربط أولية · لا تعتمد عليها ماليًا قبل إكمال مراجعة الأمان والصلاحيات.</div></div>`;
el('logout').onclick=async()=>{await db.auth.signOut();user=null;profile=null;msg='';loginScreen()};el('refresh').onclick=loadRecords;el('recordForm').onsubmit=addRecord;loadRecords()}
async function init(){const {data:{user:u}}=await db.auth.getUser();if(!u){loginScreen();return}user=u;const {data:p,error}=await db.from('profiles').select('id,full_name,role,branch_id').eq('id',u.id).maybeSingle();if(error||!p){await db.auth.signOut();msg='تم تسجيل الدخول لكن لا يوجد ملف صلاحيات للمستخدم. راجع جدول profiles.';loginScreen();return}profile=p;if(!['admin','branch_manager'].includes(profile.role)){await db.auth.signOut();msg='نوع الحساب غير مسموح.';loginScreen();return}const {data:b,error:be}=await db.from('branches').select('id,name').order('id');if(be){msg='تعذر تحميل المعارض: '+be.message;loginScreen();return}branches=b||[];if(profile.role==='branch_manager'&&!profile.branch_id){msg='حساب مدير الفرع لا يحتوي على فرع محدد.';loginScreen();return}appShell()}
async function loadRecords(){const body=el('recordsBody');if(body)body.innerHTML='<tr><td colspan="7">جارٍ تحميل البيانات…</td></tr>';let q=db.from('financial_records').select('id,branch_id,record_type,amount,description,record_date,status,created_at').order('created_at',{ascending:false}).limit(500);const {data,error}=await q;if(error){showMessage('تعذر تحميل العمليات: '+error.message,true);if(body)body.innerHTML='<tr><td colspan="7">تعذر التحميل. تحقق من سياسات RLS.</td></tr>';return}records=data||[];const byId=Object.fromEntries(branches.map(b=>[b.id,b.name]));const approved=records.filter(r=>r.status==='approved');const total=types=>approved.filter(r=>types.includes(r.record_type)).reduce((s,r)=>s+Number(r.amount),0);el('sales').textContent=money(total(['sale']));el('collections').textContent=money(total(['collection','installment','down_payment']));el('expenses').textContent=money(total(['expense']));el('pending').textContent=records.filter(r=>r.status==='pending').length;body.innerHTML=records.map(r=>`<tr><td>${esc(r.record_date)}</td><td>${esc(byId[r.branch_id]||'—')}</td><td>${esc(TYPES[r.record_type]||r.record_type)}</td><td>${esc(r.description)}</td><td>${money(r.amount)}</td><td><span class="badge ${r.status==='approved'?'ok':r.status==='rejected'?'no':''}">${r.status==='approved'?'معتمدة':r.status==='rejected'?'مرفوضة':'بانتظار الاعتماد'}</span></td>${profile.role==='admin'?`<td>${r.status==='pending'?`<div class="actions"><button data-approve="${r.id}">اعتماد</button><button data-reject="${r.id}">رفض</button></div>`:'—'}</td>`:''}</tr>`).join('')||'<tr><td colspan="7">لا توجد عمليات بعد.</td></tr>';document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>review(b.dataset.approve,'approved'));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>review(b.dataset.reject,'rejected'))}
async function addRecord(e){e.preventDefault();const btn=el('saveBtn');btn.disabled=true;const branchId=profile.role==='admin'?Number(el('branch').value):profile.branch_id;const payload={branch_id:branchId,record_type:el('type').value,amount:Number(el('amount').value),description:el('description').value.trim(),record_date:el('date').value,status:'pending',created_by:user.id};const {error}=await db.from('financial_records').insert(payload);btn.disabled=false;if(error){showMessage('لم يتم الحفظ: '+error.message,true);return}e.target.reset();el('date').value=new Date().toISOString().slice(0,10);showMessage('تم حفظ العملية بانتظار الاعتماد.');await loadRecords()}
async function review(id,status){if(profile.role!=='admin')return;const {error}=await db.from('financial_records').update({status,reviewed_by:user.id,reviewed_at:new Date().toISOString()}).eq('id',id);if(error){showMessage('تعذر تحديث حالة العملية: '+error.message,true);return}showMessage(status==='approved'?'تم اعتماد العملية.':'تم رفض العملية.');await loadRecords()}
db.auth.getSession().then(async({data})=>{if(data.session)await init();else loginScreen()});
</script></body></html>
